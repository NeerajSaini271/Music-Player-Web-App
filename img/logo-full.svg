<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 72" role="img" aria-labelledby="title desc">
  <title id="title">NKS MusicPlayer</title>
  <desc id="desc">Original violet and cyan audio-wave logo with NKS MusicPlayer wordmark</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="68" height="68" rx="20" fill="url(#brand)" />
  <g fill="#0b0b10">
    <rect x="18" y="27" width="6" height="18" rx="3" />
    <rect x="29" y="18" width="6" height="36" rx="3" />
    <rect x="40" y="11" width="6" height="50" rx="3" />
    <rect x="51" y="22" width="6" height="28" rx="3" />
  </g>
  <text x="84" y="44" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="800">NKS MusicPlayer</text>
</svg>
